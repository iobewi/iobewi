[package]
name = "iobewi-workload-ota"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Workload OTA: OTM2 persistent record, double-copy metadata store, Workload A/B state machine and recovery (no loader, no runtime, no platform)"

[features]
default = []
# Exposes the fake NOR flash used by this crate's tests and by dependants' host tests.
test-util = []
# TEST ONLY: lets a hardware test flip one bit of the staged candidate's slot (post-staging
# corruption). Never enabled in a production image.
test-fault-injection = []

[dependencies]
iobewi-update-model = { path = "../../firmware/model" }
iobewi-ota = { path = "../../firmware/update" }
embedded-storage = "0.3.1"
sha2 = { version = "0.10", default-features = false }
