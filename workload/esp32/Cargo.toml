[package]
name = "iobewi-esp-workload"
workspace = "../../targets/esp32"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP storage for the Workload OTA: partition lookup by name, capability, SharedFlash-serialized OTM2 metadata and Workload A/B slot access"
keywords = ["esp32", "ota", "workload", "flash", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]

[features]
default = []
esp32c3 = [
  "iobewi-esp-partitions/esp32c3",
  "iobewi-esp-flash/esp32c3",
]
esp32s3 = [
  "iobewi-esp-partitions/esp32s3",
  "iobewi-esp-flash/esp32s3",
]
# Native Workload execution (S19): ESP32-S3 only (second core + fixed RAM region).
native = ["esp32s3", "dep:esp-hal", "dep:embassy-time", "dep:iobewi-workload-native", "dep:iobewi-workload-abi", "dep:iobewi-workload-image", "esp-hal/esp32s3"]

[dependencies]
iobewi-workload-ota = { path = "../update" }
iobewi-update-model = { path = "../../firmware/model" }
iobewi-ota = { path = "../../firmware/update" }
iobewi-esp-flash = { path = "../../drivers/flash/esp32", default-features = false }
iobewi-esp-partitions = { path = "../../drivers/flash/partitions-esp32", default-features = false }
iobewi-workload-native = { path = "../native", optional = true }
iobewi-workload-abi = { path = "../abi", optional = true }
iobewi-workload-image = { path = "../image", optional = true }
esp-hal = { version = "~1.2", default-features = false, features = ["unstable"], optional = true }
embassy-time = { version = "0.5.0", optional = true }
embedded-storage = "0.3.1"
sha2 = { version = "0.10", default-features = false }
