[package]
name = "iobewi-esp-workload"
workspace = "../../targets/esp32"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP storage for the Workload OTA: partition lookup by name, capability, SharedFlash-serialized OTM2 metadata and Workload A/B slot access"
keywords = ["esp32", "ota", "workload", "flash", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]

[features]
default = []
esp32c3 = [
  "esp-bootloader-esp-idf/esp32c3",
  "iobewi-esp-flash/esp32c3",
]
esp32s3 = [
  "esp-bootloader-esp-idf/esp32s3",
  "iobewi-esp-flash/esp32s3",
]

[dependencies]
iobewi-workload-ota = { path = "../update" }
iobewi-update-model = { path = "../../firmware/model" }
iobewi-ota = { path = "../../firmware/update" }
iobewi-esp-flash = { path = "../../drivers/flash/esp32", default-features = false }
esp-bootloader-esp-idf = { version = "=0.5.0", default-features = false }
embedded-storage = "0.3.1"
sha2 = { version = "0.10", default-features = false }
