[package]
name = "iobewi-entry"
workspace = "../targets/esp32"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
[features]
default = []
esp32s3 = ["dep:iobewi-esp-runtime", "dep:esp-hal", "dep:esp-rtos", "dep:esp-alloc", "dep:esp-bootloader-esp-idf", "dep:esp-metadata-generated", "dep:embassy-executor", "dep:embassy-net", "dep:static_cell"]
[dependencies]
iobewi-board = { path = "../board" }
iobewi-esp-runtime = { path = "../arch/esp32/runtime", features = ["board-s3-native-usb"], optional = true }
esp-hal = { version = "~1.2", default-features = false, features = ["esp32s3", "rt", "unstable"], optional = true }
esp-rtos = { version = "=0.4.0", default-features = false, features = ["esp32s3", "embassy", "esp-radio", "esp-alloc"], optional = true }
esp-alloc = { version = "~0.11", default-features = false, features = ["esp32s3", "global-allocator", "compat"], optional = true }
esp-bootloader-esp-idf = { version = "~0.6", default-features = false, features = ["esp32s3"], optional = true }
esp-metadata-generated = { version = "~0.5", optional = true }
embassy-executor = { version = "0.10.0", default-features = false, optional = true }
embassy-net = { version = "0.9.1", default-features = false, features = ["dhcpv4", "medium-ethernet", "tcp", "dns"], optional = true }
static_cell = { version = "2.1", optional = true }
