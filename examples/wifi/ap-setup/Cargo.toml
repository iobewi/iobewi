[package]
name = "wifi-ap-setup-example"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Hardware-agnostic example: provision Wi-Fi through the soft access point (portable product logic)"
publish = false

[dependencies]
iobewi-wifi-core = { path = "../../../net/wifi/core" }
iobewi-wifi-manager = { path = "../../../net/wifi/manager" }
iobewi-config-space = { path = "../../../fs/config" }
iobewi-http-server = { path = "../../../net/http/server" }
iobewi-net-io = { path = "../../../net/io" }
picoserve = { version = "0.20.0", default-features = false, features = ["embassy", "alloc"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
embassy-sync = "0.8"
embassy-time = "0.5"
embassy-futures = "0.1"
log = { version = "0.4", default-features = false }

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
embassy-time = { version = "0.5", features = ["std", "generic-queue-8"] }
