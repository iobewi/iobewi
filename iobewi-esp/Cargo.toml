[workspace]
resolver = "2"
members = [
  "hardware/flash", "hardware/nvs", "hardware/partitions",
  
  "adapters/ota", "adapters/config-space", "services/tls", "services/http", "services/https", "services/indicator", "services/runtime", "services/reboot", "services/device", "../drivers/hw_random/esp32", "../drivers/console/esp32", "../drivers/net/wifi/esp32", "../crypto/mbedtls", "../drivers/watchdog/esp32", "../arch/esp32/reset",
]
default-members = ["services/http", "services/https"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/iobewi/iobewi-esp"
