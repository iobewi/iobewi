[package]
name = "iobewi-net-tcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TCP listener and accepted socket over an embassy-net stack, as net/io connections (no HAL dependency)"

[dependencies]
iobewi-net-io = { path = "../io" }
embedded-io-async = "0.7.0"
embassy-net = { version = "0.9.1", default-features = false, features = ["tcp", "medium-ethernet", "proto-ipv4"] }
log = "0.4"
