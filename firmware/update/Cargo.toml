[package]
name = "iobewi-ota"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Firmware update transactions: prepare / streaming write / publish / activate / reconcile / confirm-or-rollback orchestration, restart-safe, platform- and transport-independent"

[features]
default = []
runtime = ["dep:embassy-sync", "dep:embassy-time", "dep:embassy-futures"]
config-space = ["dep:iobewi-config-space"]

[dependencies]
iobewi-firmware-image = { path = "../image", features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
embassy-sync = { version = "0.8.0", optional = true }
embassy-time = { version = "0.5.0", optional = true }
embassy-futures = { version = "0.1", optional = true }
iobewi-config-space = { path = "../../fs/config", optional = true }

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
embassy-time = { version = "0.5.0", features = ["std", "generic-queue-8"] }
