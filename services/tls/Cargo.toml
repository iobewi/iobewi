[package]
name = "iobewi-tls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable TLS identity and trust configuration service"

[features]
default = []
http = ["dep:iobewi-http-server", "dep:serde", "dep:serde_json"]

[dependencies]
iobewi-config-space = { path = "../../fs/config" }
log = { version = "0.4", default-features = false }
iobewi-http-server = { path = "../../net/http/server", optional = true }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc"], optional = true }
