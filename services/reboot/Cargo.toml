[package]
name = "iobewi-esp-reboot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP RTC-watchdog one-shot reboot adapter for the portable IOBEWI OTA reboot capability"

[features]
default = []
esp32c3 = ["esp-hal/esp32c3"]
esp32s3 = ["esp-hal/esp32s3"]

[dependencies]
# Same rev embewi-agent pins for the main iobewi-ota engine: RebootPort is a
# real trait defined in iobewi_ota::http, not a re-exported alias, so this
# must be the exact instance the router's `R: RebootPort` bound resolves
# against wherever iobewi_ota::http::routes() gets called.
iobewi-ota = { git = "https://github.com/iobewi/iobewi", rev = "c47100e36b429dcfca1c735749f6079a3b2463df", features = ["http"] }
esp-hal = { version = "~1.1.0", default-features = false, features = ["unstable"] }
embassy-executor = "0.10.0"
embassy-time = { version = "0.5.0", default-features = false }
embassy-sync = "0.8.0"
static_cell = "2.1.1"
