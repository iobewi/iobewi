[package]
name = "iobewi-esp-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP/Xtensa/RISC-V stack high-water-mark measurement for the portable IOBEWI runtime diagnostics capability"

[features]
default = []
esp32c3 = ["dep:esp-alloc", "esp-alloc/esp32c3"]
esp32s3 = ["dep:esp-alloc", "esp-alloc/esp32s3"]

[dependencies]
# TEMPORARY: pinned to iobewi's feat/heap-diagnostics branch while that
# chantier is in flight; bump to a main commit once it merges.
iobewi-runtime = { git = "https://github.com/iobewi/iobewi", rev = "2c0b02a6e797e046db994c4eb0bbf3bba649db83" }
esp-alloc = { version = "0.10.0", optional = true }
