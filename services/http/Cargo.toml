[package]
name = "iobewi-esp-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP TCP listener for portable IOBEWI HTTP dispatch"

[features]
default = []
esp32s3 = ["esp-hal/esp32s3"]

[dependencies]
iobewi-http = { git = "https://github.com/iobewi/iobewi", rev = "fc6bd3cbbeb697e9d72e1fbfda466ad02079ea0c" }
esp-hal = { version = "~1.1.0", default-features = false, features = ["unstable"] }
embassy-net = { version = "0.9.1", default-features = false, features = ["tcp", "medium-ethernet"] }
picoserve = { version = "0.20.0", default-features = false, features = ["embassy", "alloc"] }
log = "0.4"
