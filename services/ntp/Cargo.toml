[package]
name = "iobewi-ntp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable SNTP synchronization and Unix epoch clock for Embassy networks"

[dependencies]
critical-section = "1.2"
embassy-executor = "0.10.0"
embassy-net = { version = "0.9.1", features = ["dns", "udp"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.0"
log = "0.4"
sntpc = { version = "0.11", default-features = false, features = ["log"] }
sntpc-net-embassy = { version = "0.11", default-features = false, features = ["log"] }
sntpc-time-embassy = "0.6"
