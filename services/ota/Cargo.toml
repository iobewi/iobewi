[package]
name = "iobewi-ota"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable transactional OTA service with restart-safe A/B reconciliation"

[features]
default = []
http = ["dep:picoserve", "dep:serde", "dep:serde_json"]
runtime = ["dep:embassy-sync", "dep:embassy-time", "dep:embassy-futures"]

[dependencies]
sha2 = { version = "0.10", default-features = false }
picoserve = { version = "0.20.0", default-features = false, features = ["embassy", "alloc"], optional = true }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc"], optional = true }
embassy-sync = { version = "0.8.0", optional = true }
embassy-time = { version = "0.5.0", optional = true }
embassy-futures = { version = "0.1", optional = true }
