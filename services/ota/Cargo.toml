[package]
name = "iobewi-ota"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable transactional OTA service with restart-safe A/B reconciliation"

[features]
default = []
http = ["dep:picoserve", "dep:serde"]

[dependencies]
sha2 = { version = "0.10", default-features = false }
picoserve = { version = "0.20.0", default-features = false, features = ["embassy", "alloc"], optional = true }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
