[package]
name = "iobewi-esp-watchdog"
workspace = "../../../targets/esp32"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP timer-group watchdog hardware primitive"
keywords = ["esp32", "watchdog", "embedded", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]

[features]
default = []
esp32c3 = ["esp-hal/esp32c3"]
esp32s3 = ["esp-hal/esp32s3"]

[dependencies]
esp-hal = { version = "=1.1.2", default-features = false, features = ["unstable"] }
