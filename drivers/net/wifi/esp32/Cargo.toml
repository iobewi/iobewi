[package]
name = "iobewi-esp-wifi"
workspace = "../../../../iobewi-esp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ESP Wi-Fi station manager for esp-radio and Embassy networking"
repository.workspace = true
readme = "README.md"
keywords = ["esp32", "wifi", "embassy", "embedded", "no-std"]
categories = ["embedded", "network-programming", "no-std"]

[features]
default = []
esp32c3 = ["esp-hal/esp32c3", "esp-radio/esp32c3"]
esp32s3 = ["esp-hal/esp32s3", "esp-hal/rt", "esp-radio/esp32s3"]

[dependencies]
iobewi-wifi-core = { path = "../../../../net/wifi/core" }
embassy-executor = { version = "0.10.0", default-features = false }
embassy-time = { version = "0.5.0", default-features = false }
embassy-net = { version = "0.9.1", default-features = false, features = [
  "dhcpv4",
  "medium-ethernet",
  "tcp",
] }
esp-hal = { version = "~1.1.0", default-features = false, features = ["unstable"] }
esp-radio = { version = "0.18.0", default-features = false, features = [
  "esp-alloc",
  "log-04",
  "unstable",
  "wifi",
] }
log = { version = "0.4.29", default-features = false }
