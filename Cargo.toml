[workspace]
resolver = "2"
members = [
  "hardware/flash", "hardware/nvs", "hardware/partitions",
  "hardware/platform", "hardware/boot", "hardware/ota-boot", "hardware/watchdog",
  "adapters/ota", "adapters/config-space", "services/wifi", "services/tls", "services/http", "services/https", "services/log-stream", "services/indicator", "services/runtime", "services/reboot",
]
default-members = ["services/http", "services/https"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/iobewi/iobewi-esp"
