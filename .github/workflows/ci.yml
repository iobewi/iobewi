name: Rust
on:
  push:
  pull_request:
jobs:
  refresh-esp-lockfiles:
    if: github.ref == 'refs/heads/migration/esp-latest-ci'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate ESP lockfiles from the 1.2 baseline
        run: |
          set -eux
          (cd targets/esp32 && cargo generate-lockfile)
          (cd bootloader/esp && cargo generate-lockfile)
      - name: Commit refreshed lockfiles on migration branch
        run: |
          if git diff --quiet -- targets/esp32/Cargo.lock bootloader/esp/Cargo.lock; then
            echo "ESP lockfiles already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add targets/esp32/Cargo.lock bootloader/esp/Cargo.lock
          git commit -m "esp: refresh 1.2 baseline lockfiles"
          git push origin HEAD:migration/esp-latest-ci

  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace --all-features
      - run: cargo check --workspace --no-default-features
      - run: cargo test -p iobewi-config-space
      - run: cargo test -p iobewi-net-io
      - run: cargo test -p iobewi-net-tls-core
      - run: cargo test -p iobewi-indicator
      - run: cargo test -p iobewi-update-model
      - run: cargo test -p iobewi-workload-ota
      - run: cargo test -p iobewi-workload-ota-http
      - run: cargo test -p iobewi-runtime
      - run: cargo test -p iobewi-device
      - run: cargo test -p iobewi-entropy
      - run: cargo test -p iobewi-http-server
      - run: cargo test -p iobewi-http-client --features websocket
      - run: cargo check -p iobewi-http-client
      - run: cargo test -p iobewi-log
      - run: cargo test -p iobewi-log-stream
      - run: cargo test -p iobewi-time
      - run: cargo test -p iobewi-ntp
      - run: cargo test -p iobewi-wifi-core
      - run: cargo test -p iobewi-wifi-manager
      - run: cargo test -p iobewi-tls-service
      - run: cargo test -p iobewi-tls-http
      - run: cargo test -p iobewi-time
      - run: cargo test -p iobewi-ota
      - run: cargo test -p iobewi-ota-http
      - run: cargo test -p iobewi-firmware-slots
      - run: cargo test -p iobewi-firmware-image --features alloc
      - run: cargo test -p iobewi-firmware-boot
      - run: cargo test -p iobewi-nvs-core
      - run: cargo check -p iobewi-esp-platform -p iobewi-esp-boot --features iobewi-esp-boot/esp32s3
      - run: cargo test -p iobewi-ota --features runtime,config-space
  # --- targets/esp32: ESP workspace (build/toolchain config only; members live in their subsystems) ---
  esp-host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: targets/esp32
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
  esp-esp32s3:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: targets/esp32
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust for Xtensa
        uses: esp-rs/xtensa-toolchain@v1.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          buildtargets: esp32s3
      - run: cargo +esp check -Z build-std=core,alloc --target xtensa-esp32s3-none-elf -p iobewi-esp-tcp
      - run: cargo +esp check -Z build-std=core,alloc --target xtensa-esp32s3-none-elf -p iobewi-esp-workload --features esp32s3
      - run: cargo +esp check -Z build-std=core,alloc --target riscv32imc-unknown-none-elf -p iobewi-esp-workload --features esp32c3
      - run: cargo +esp check -Z build-std=core,alloc --target xtensa-esp32s3-none-elf -p iobewi-esp-ota --features esp32s3,shared-flash
      - run: cargo +esp check -Z build-std=core,alloc --target xtensa-esp32s3-none-elf -p iobewi-esp-config-space --features esp32s3
      - run: cargo +esp check -Z build-std=core,alloc --target xtensa-esp32s3-none-elf -p iobewi-esp-wifi --features esp32s3
      - run: cargo +esp check -Z build-std=core,alloc --target xtensa-esp32s3-none-elf -p iobewi-esp-tls --features esp32s3,embassy-net
      - run: cargo +esp check -Z build-std=core,alloc --target xtensa-esp32s3-none-elf -p iobewi-crypto-mbedtls --features use-gcc
      - run: cargo +esp check -Z build-std=core,alloc --target xtensa-esp32s3-none-elf -p iobewi-esp-entropy --features esp32s3,rand-core
      - run: cargo +esp check -Z build-std=core,alloc --target xtensa-esp32s3-none-elf -p iobewi-esp-console --features esp32s3
      - run: cargo +esp check -Z build-std=core,alloc --target xtensa-esp32s3-none-elf -p iobewi-esp-watchdog --features esp32s3
      - run: cargo +esp check -Z build-std=core,alloc --target xtensa-esp32s3-none-elf -p iobewi-esp-indicator --features esp32s3
      - run: cargo +esp check -Z build-std=core,alloc --target xtensa-esp32s3-none-elf -p iobewi-esp-runtime --features esp32s3
      - run: cargo +esp check -Z build-std=core,alloc --target xtensa-esp32s3-none-elf -p iobewi-esp-device --features esp32s3
      - run: cargo +esp check -Z build-std=core,alloc --target xtensa-esp32s3-none-elf -p iobewi-esp-entropy --features esp32s3
      - run: cargo +esp check -Z build-std=core,alloc --target xtensa-esp32s3-none-elf -p iobewi-esp-reset --features esp32s3
  # Canary: test the current ESP ecosystem independently from the committed lockfile.
  # This job intentionally mutates only the CI checkout. Normal builds remain --locked/reproducible.
  esp-latest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: targets/esp32
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust for Xtensa
        uses: esp-rs/xtensa-toolchain@v1.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          buildtargets: esp32s3
      - name: Select current ESP generation
        run: bash ./ci/use-latest-esp.sh
      - name: Resolve latest allowed dependencies
        run: rm -f Cargo.lock && cargo +esp generate-lockfile
      - name: ESP32-S3 compatibility matrix
        run: |
          set -eux
          cargo +esp check -Z build-std=core,alloc --target xtensa-esp32s3-none-elf -p iobewi-esp-tcp
          cargo +esp check -Z build-std=core,alloc --target xtensa-esp32s3-none-elf -p iobewi-esp-workload --features esp32s3
          cargo +esp check -Z build-std=core,alloc --target xtensa-esp32s3-none-elf -p iobewi-esp-ota --features esp32s3,shared-flash
          cargo +esp check -Z build-std=core,alloc --target xtensa-esp32s3-none-elf -p iobewi-esp-config-space --features esp32s3
          cargo +esp check -Z build-std=core,alloc --target xtensa-esp32s3-none-elf -p iobewi-esp-wifi --features esp32s3
          cargo +esp check -Z build-std=core,alloc --target xtensa-esp32s3-none-elf -p iobewi-esp-tls --features esp32s3,embassy-net
          cargo +esp check -Z build-std=core,alloc --target xtensa-esp32s3-none-elf -p iobewi-esp-entropy --features esp32s3,rand-core
          cargo +esp check -Z build-std=core,alloc --target xtensa-esp32s3-none-elf -p iobewi-esp-watchdog --features esp32s3
          cargo +esp check -Z build-std=core,alloc --target xtensa-esp32s3-none-elf -p iobewi-esp-indicator --features esp32s3
          cargo +esp check -Z build-std=core,alloc --target xtensa-esp32s3-none-elf -p iobewi-esp-device --features esp32s3
      - name: ESP32-C3 compatibility smoke
        run: |
          set -eux
          cargo +esp check -Z build-std=core,alloc --target riscv32imc-unknown-none-elf -p iobewi-esp-workload --features esp32c3
          cargo +esp check -Z build-std=core,alloc --target riscv32imc-unknown-none-elf -p iobewi-esp-config-space --features esp32c3
          cargo +esp check -Z build-std=core,alloc --target riscv32imc-unknown-none-elf -p iobewi-esp-wifi --features esp32c3

  esp-bootloader:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: targets/esp32
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust for Xtensa
        uses: esp-rs/xtensa-toolchain@v1.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          buildtargets: esp32s3
      - run: cargo +esp check --manifest-path ../../bootloader/esp/Cargo.toml --locked -Z build-std=core,alloc --target xtensa-esp32s3-none-elf --features esp32s3
