name: Rust
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily: catches upstream drift inside the supported esp-hal 1.2 range (job `esp (latest)`).
    - cron: "17 4 * * *"
# Supersede obsolete PR runs without cancelling main or scheduled validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace --all-features
      - run: cargo check --workspace --no-default-features
      - run: cargo test -p iobewi-config-space
      - run: cargo test -p iobewi-block -p iobewi-fat16
      - run: cargo test -p iobewi-usb-msc
      - run: cargo test -p iobewi-rolling-stream
      - run: cargo test -p iobewi-net-io
      - run: cargo test -p iobewi-net-tls-core
      - run: cargo test -p iobewi-indicator
      - run: cargo test -p iobewi-update-model
      - run: cargo test -p iobewi-workload-ota
      - run: cargo test -p iobewi-workload-ota-http
      - run: cargo test -p iobewi-runtime
      - run: cargo test -p iobewi-device
      - run: cargo test -p iobewi-board --locked
      - run: cargo test -p iobewi-esp-platform -p gpio15-metadata-proof --locked
      - run: cargo test -p iobewi-entropy
      - run: cargo test -p iobewi-http-server
      - run: cargo test -p iobewi-http-client --features websocket
      - run: cargo check -p iobewi-http-client
      - run: cargo test -p iobewi-log
      - run: cargo test -p iobewi-log-stream
      - run: cargo test -p iobewi-time
      - run: cargo test -p iobewi-ntp
      - run: cargo test -p iobewi-wifi-core
      - run: cargo test -p iobewi-wifi-manager
      - run: cargo test -p iobewi-tls-service
      - run: cargo test -p iobewi-tls-http
      - run: cargo test -p iobewi-ota
      - run: cargo test -p iobewi-ota-http
      - run: cargo test -p iobewi-firmware-slots
      - run: cargo test -p iobewi-firmware-image --features alloc
      - run: cargo test -p iobewi-firmware-boot
      - run: cargo test -p iobewi-nvs-core
      - run: cargo check -p iobewi-usb-msc --features usb-debug
      - run: cargo check -p iobewi-esp-platform -p iobewi-esp-boot --features iobewi-esp-boot/esp32s3
      - run: cargo test -p iobewi-ota --features runtime,config-space
  # ESP support policy: esp-hal 1.2.x (manifests carry `~1.2`, i.e. >=1.2.0 <1.3.0).
  #   locked: committed Cargo.lock + --locked = the validated, reproducible baseline.
  #   latest: same manifest ranges, Cargo.lock removed in this checkout only = newest
  #           allowed 1.2.x. It never tests 1.3: moving to 1.3 is an explicit migration.
  esp:
    name: esp (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [locked, latest]
    defaults:
      run:
        working-directory: targets/esp32
    env:
      FLAGS: ${{ matrix.mode == 'locked' && '--locked' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust for Xtensa
        uses: esp-rs/xtensa-toolchain@v1.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          buildtargets: esp32s3
      - name: Resolve newest dependencies allowed by the manifests
        if: matrix.mode == 'latest'
        run: rm -f Cargo.lock && cargo +esp generate-lockfile
      - name: Resolved ESP stack must stay on esp-hal 1.2.x
        run: |
          set -eu
          grep -A1 -E '^name = "esp-(hal|radio|storage|bootloader-esp-idf|hal-smartled)"$' Cargo.lock | grep -E '^(name|version)'
          grep -A1 -E '^name = "esp-hal"$' Cargo.lock | grep -q 'version = "1\.2\.'
      - name: Runtime flash ROM calls must retain interrupt protection
        run: python3 ../../tools/ci/check_esp_storage_features.py $FLAGS
      - name: ESP32-S3
        run: |
          set -eux
          T=xtensa-esp32s3-none-elf
          cargo +esp check $FLAGS -Z build-std=core,alloc --target $T -p iobewi-esp-tcp
          cargo +esp check $FLAGS -Z build-std=core,alloc --target $T -p iobewi-esp-workload --features esp32s3
          cargo +esp check $FLAGS -Z build-std=core,alloc --target $T -p iobewi-esp-ota --features esp32s3,shared-flash
          cargo +esp check $FLAGS -Z build-std=core,alloc --target $T -p iobewi-esp-config-space --features esp32s3
          cargo +esp check $FLAGS -Z build-std=core,alloc --target $T -p iobewi-esp-wifi --features esp32s3
          cargo +esp check $FLAGS -Z build-std=core,alloc --target $T -p iobewi-esp-tls --features esp32s3,embassy-net
          cargo +esp check $FLAGS -Z build-std=core,alloc --target $T -p iobewi-crypto-mbedtls --features use-gcc
          cargo +esp check $FLAGS -Z build-std=core,alloc --target $T -p iobewi-esp-entropy --features esp32s3,rand-core
          cargo +esp check $FLAGS -Z build-std=core,alloc --target $T -p iobewi-esp-entropy --features esp32s3
          cargo +esp check $FLAGS -Z build-std=core,alloc --target $T -p iobewi-esp-console --features esp32s3
          cargo +esp check $FLAGS -Z build-std=core,alloc --target $T -p iobewi-esp-watchdog --features esp32s3
          cargo +esp check $FLAGS -Z build-std=core,alloc --target $T -p iobewi-esp-ws2812 --features esp32s3
          cargo +esp check $FLAGS -Z build-std=core,alloc --target $T -p iobewi-esp-runtime --features esp32s3
          cargo +esp check $FLAGS -Z build-std=core,alloc --target $T -p iobewi-esp-device --features esp32s3
          cargo +esp check $FLAGS -Z build-std=core,alloc --target $T -p iobewi-esp-reset --features esp32s3
      - name: Entry macro downstream link and negative hygiene experiment
        working-directory: .
        run: bash tools/experiments/entry15/run.sh ${{ matrix.mode }}
      - name: Board startup downstream link in both USB modes
        working-directory: .
        run: bash tools/experiments/board15/run.sh ${{ matrix.mode }}
      - name: ESP32-C3 smoke
        run: |
          set -eux
          T=riscv32imc-unknown-none-elf
          cargo +esp check $FLAGS -Z build-std=core,alloc --target $T -p iobewi-esp-workload --features esp32c3
          cargo +esp check $FLAGS -Z build-std=core,alloc --target $T -p iobewi-esp-config-space --features esp32c3
          cargo +esp check $FLAGS -Z build-std=core,alloc --target $T -p iobewi-esp-device --features esp32c3
          cargo +esp check $FLAGS -Z build-std=core,alloc --target $T -p iobewi-esp-wifi --features esp32c3
          cargo +esp check $FLAGS -Z build-std=core,alloc --target $T -p iobewi-esp-ota --features esp32c3,shared-flash
          cargo +esp check $FLAGS -Z build-std=core,alloc --target $T -p iobewi-esp-ws2812 --features esp32c3

  esp-bootloader:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: targets/esp32
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust for Xtensa
        uses: esp-rs/xtensa-toolchain@v1.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          buildtargets: esp32s3
      - run: cargo +esp check --manifest-path ../../bootloader/esp/Cargo.toml --locked -Z build-std=core,alloc --target xtensa-esp32s3-none-elf --features esp32s3
